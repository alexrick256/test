<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Süßigkeiten-Ranking</title>
<style>
  :root {
    --bg: #fff7fb; --card: #ffffff; --text: #3b2540; --muted: #8a7590;
    --accent: #ff4f9a; --accent2: #ffb703; --border: #f1dff0; --gold: #ffc53d;
    --silver: #b8c0cc; --bronze: #d9894b; --danger: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1220; --card: #271a2e; --text: #f6e9fa; --muted: #b59cbd; --border: #3b2a44; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  header { text-align: center; padding: 16px 0 8px; }
  h1 { margin: 0; font-size: 2rem; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); margin-top: 4px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-top: 16px; box-shadow: 0 2px 10px rgba(255,79,154,.07); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input[type=text], select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  input[type=text] { flex: 1 1 200px; min-width: 0; }
  textarea { width: 100%; resize: vertical; margin-top: 10px; }
  button { cursor: pointer; border: 0; border-radius: 10px; padding: 10px 14px; background: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.small { padding: 6px 10px; font-size: .85rem; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  button:hover { filter: brightness(1.08); }
  .score-line { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .score-line input[type=range] { flex: 1; accent-color: var(--accent); }
  .score-badge { min-width: 56px; text-align: center; font-weight: 800; font-size: 1.2rem; color: var(--accent); }
  .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: end; margin-top: 16px; }
  .pod { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 8px; text-align: center; }
  .pod .emoji { font-size: 2.2rem; }
  .pod .name { font-weight: 700; margin-top: 4px; word-break: break-word; }
  .pod .pts { color: var(--muted); font-size: .9rem; }
  .pod.p1 { order: 2; padding-top: 26px; padding-bottom: 26px; border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .pod.p2 { order: 1; border-color: var(--silver); }
  .pod.p3 { order: 3; border-color: var(--bronze); }
  .medal { font-size: 1.5rem; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .tools input[type=text] { flex: 2 1 160px; }
  .tools select { flex: 1 1 130px; }
  ol { list-style: none; padding: 0; margin: 12px 0 0; }
  li.item { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .rank { width: 34px; text-align: center; font-weight: 800; color: var(--muted); flex: none; }
  .item .emoji { font-size: 1.8rem; flex: none; }
  .info { flex: 1; min-width: 0; }
  .info .name { font-weight: 700; word-break: break-word; }
  .info .meta { color: var(--muted); font-size: .85rem; }
  .info .note { font-size: .85rem; margin-top: 2px; font-style: italic; }
  .bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .score { font-weight: 800; font-size: 1.15rem; color: var(--accent); flex: none; min-width: 44px; text-align: right; }
  .actions { display: flex; gap: 6px; flex: none; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px dashed var(--border); background: transparent; color: var(--text); font-weight: 500; padding: 4px 10px; border-radius: 99px; font-size: .85rem; }
  details summary { cursor: pointer; font-weight: 600; }
  footer { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
  @media (max-width: 520px) { .actions { flex-direction: column; } li.item { flex-wrap: wrap; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍬 <span>Süßigkeiten-Ranking</span></h1>
    <div class="sub">Bewerte deine Lieblingssüßigkeiten und finde heraus, was ganz oben steht.</div>
  </header>

  <section class="card" id="formCard">
    <div class="row">
      <input type="text" id="name" placeholder="Name, z. B. Haribo Goldbären" maxlength="60" autocomplete="off">
      <select id="category" aria-label="Kategorie"></select>
      <button id="addBtn">Hinzufügen</button>
    </div>
    <div class="score-line">
      <label for="score">Bewertung</label>
      <input type="range" id="score" min="1" max="10" step="0.5" value="7">
      <div class="score-badge" id="scoreBadge">7</div>
    </div>
    <textarea id="note" rows="2" placeholder="Notiz (optional): Geschmack, Konsistenz, Erinnerungen …" maxlength="200"></textarea>
    <details style="margin-top:12px">
      <summary>Schnellauswahl beliebter Süßigkeiten</summary>
      <div class="quick" id="quick"></div>
    </details>
  </section>

  <section id="podium" class="podium"></section>

  <div class="tools">
    <input type="text" id="search" placeholder="🔍 Suchen …">
    <select id="filter" aria-label="Filter nach Kategorie"></select>
    <select id="sort" aria-label="Sortierung">
      <option value="score">Beste zuerst</option>
      <option value="worst">Schlechteste zuerst</option>
      <option value="name">Name A–Z</option>
      <option value="new">Neueste zuerst</option>
    </select>
  </div>

  <ol id="list"></ol>

  <footer>
    <button class="ghost small" id="exportBtn">⬇️ Export</button>
    <button class="ghost small" id="importBtn">⬆️ Import</button>
    <button class="danger small" id="clearBtn">Alles löschen</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>
</div>

<script>
const CATEGORIES = {
  schoko:  { label: "Schokolade", emoji: "🍫" },
  riegel:  { label: "Riegel", emoji: "🍫" },
  gummi:   { label: "Gummibonbons", emoji: "🧸" },
  lakritz: { label: "Lakritz", emoji: "🖤" },
  bonbon:  { label: "Bonbons & Lutscher", emoji: "🍭" },
  keks:    { label: "Kekse & Gebäck", emoji: "🍪" },
  eis:     { label: "Eis", emoji: "🍦" },
  kaugummi:{ label: "Kaugummi", emoji: "🫧" },
  sonstige:{ label: "Sonstiges", emoji: "🍬" }
};

const PRESETS = [
  ["Haribo Goldbären","gummi"],["Haribo Color-Rado","lakritz"],["Maoam","bonbon"],["Skittles","bonbon"],
  ["Snickers","riegel"],["Twix","riegel"],["Mars","riegel"],["Bounty","riegel"],["KitKat","riegel"],["Kinder Riegel","riegel"],
  ["Milka Alpenmilch","schoko"],["Ritter Sport Alpenmilch","schoko"],["Lindt Excellence","schoko"],["Toblerone","schoko"],
  ["Ferrero Rocher","schoko"],["Raffaello","schoko"],["Kinder Bueno","riegel"],["Hanuta","keks"],["Duplo","riegel"],
  ["Toffifee","bonbon"],["Nimm2","bonbon"],["Werther's Original","bonbon"],["Chupa Chups","bonbon"],
  ["M&M's","schoko"],["Smarties","schoko"],["Oreo","keks"],["Prinzenrolle","keks"],["Saure Zungen","gummi"],
  ["Lakritzschnecken","lakritz"],["Salmiak","lakritz"],["Magnum","eis"],["Ben & Jerry's Cookie Dough","eis"]
];

const KEY = "suessigkeiten-ranking-v1";
const $ = id => document.getElementById(id);
let items = [];
let editingId = null;

function load() {
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch { items = []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {}
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

function fillSelects() {
  const opts = Object.entries(CATEGORIES).map(([k, v]) => `<option value="${k}">${v.emoji} ${v.label}</option>`).join("");
  $("category").innerHTML = opts;
  $("filter").innerHTML = `<option value="">Alle Kategorien</option>` + opts;
  $("quick").innerHTML = PRESETS.map(([n, c], i) => `<button class="chip" data-i="${i}">${CATEGORIES[c].emoji} ${esc(n)}</button>`).join("");
}

function sorted(list) {
  const mode = $("sort").value;
  const l = [...list];
  if (mode === "score") l.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "de"));
  if (mode === "worst") l.sort((a, b) => a.score - b.score || a.name.localeCompare(b.name, "de"));
  if (mode === "name") l.sort((a, b) => a.name.localeCompare(b.name, "de"));
  if (mode === "new") l.sort((a, b) => b.created - a.created);
  return l;
}

function render() {
  // Podium: Top 3 insgesamt
  const top = [...items].sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "de")).slice(0, 3);
  const medals = ["🥇", "🥈", "🥉"];
  $("podium").innerHTML = top.map((it, i) => `
    <div class="pod p${i + 1}">
      <div class="medal">${medals[i]}</div>
      <div class="emoji">${CATEGORIES[it.category]?.emoji || "🍬"}</div>
      <div class="name">${esc(it.name)}</div>
      <div class="pts">${fmt(it.score)} / 10</div>
    </div>`).join("");

  // Rangplatz immer anhand der Gesamtwertung (unabhängig von Filter/Sortierung)
  const rankMap = new Map();
  [...items].sort((a, b) => b.score - a.score).forEach((it, i, arr) => {
    rankMap.set(it.id, i > 0 && arr[i - 1].score === it.score ? rankMap.get(arr[i - 1].id) : i + 1);
  });

  const q = $("search").value.trim().toLowerCase();
  const cat = $("filter").value;
  const shown = sorted(items.filter(it =>
    (!cat || it.category === cat) && (!q || it.name.toLowerCase().includes(q))));

  $("list").innerHTML = shown.length ? shown.map(it => `
    <li class="item" data-id="${it.id}">
      <div class="rank">#${rankMap.get(it.id)}</div>
      <div class="emoji">${CATEGORIES[it.category]?.emoji || "🍬"}</div>
      <div class="info">
        <div class="name">${esc(it.name)}</div>
        <div class="meta">${CATEGORIES[it.category]?.label || "Sonstiges"}</div>
        ${it.note ? `<div class="note">„${esc(it.note)}“</div>` : ""}
        <div class="bar"><i style="width:${it.score * 10}%"></i></div>
      </div>
      <div class="score">${fmt(it.score)}</div>
      <div class="actions">
        <button class="ghost small" data-act="edit" title="Bearbeiten">✏️</button>
        <button class="danger small" data-act="del" title="Löschen">🗑️</button>
      </div>
    </li>`).join("")
    : `<div class="empty">${items.length ? "Keine Treffer." : "Noch nichts bewertet – füge oben deine erste Süßigkeit hinzu 🍭"}</div>`;
}

function resetForm() {
  editingId = null;
  $("name").value = ""; $("note").value = "";
  $("score").value = 7; $("scoreBadge").textContent = "7";
  $("addBtn").textContent = "Hinzufügen";
}

function submit() {
  const name = $("name").value.trim();
  if (!name) { $("name").focus(); return; }
  const data = { name, category: $("category").value, score: parseFloat($("score").value), note: $("note").value.trim() };
  if (editingId) {
    Object.assign(items.find(i => i.id === editingId), data);
  } else {
    const dup = items.find(i => i.name.toLowerCase() === name.toLowerCase());
    if (dup && !confirm(`„${dup.name}“ gibt es schon. Trotzdem hinzufügen?`)) return;
    items.push({ id: uid(), created: Date.now(), ...data });
  }
  save(); resetForm(); render();
}

$("addBtn").onclick = submit;
$("name").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
$("score").oninput = e => { $("scoreBadge").textContent = fmt(parseFloat(e.target.value)); };
["search", "filter", "sort"].forEach(id => $(id).addEventListener("input", render));

$("quick").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const [n, c] = PRESETS[b.dataset.i];
  $("name").value = n; $("category").value = c; $("name").focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

$("list").onclick = e => {
  const btn = e.target.closest("button[data-act]"); if (!btn) return;
  const it = items.find(i => i.id === btn.closest("li").dataset.id);
  if (btn.dataset.act === "del") {
    if (confirm(`„${it.name}“ löschen?`)) { items = items.filter(i => i !== it); save(); render(); }
  } else {
    editingId = it.id;
    $("name").value = it.name; $("category").value = it.category;
    $("score").value = it.score; $("scoreBadge").textContent = fmt(it.score);
    $("note").value = it.note || ""; $("addBtn").textContent = "Speichern";
    window.scrollTo({ top: 0, behavior: "smooth" }); $("name").focus();
  }
};

$("exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(items, null, 2)], { type: "application/json" }));
  a.download = "suessigkeiten-ranking.json"; a.click(); URL.revokeObjectURL(a.href);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    const clean = data.filter(d => d && typeof d.name === "string" && Number.isFinite(d.score))
      .map(d => ({ id: uid(), created: d.created || Date.now(), name: d.name.slice(0, 60),
        category: CATEGORIES[d.category] ? d.category : "sonstige",
        score: Math.min(10, Math.max(1, d.score)), note: String(d.note || "").slice(0, 200) }));
    if (confirm(`${clean.length} Einträge importieren? OK = hinzufügen, Abbrechen = nichts tun.`)) {
      items = items.concat(clean); save(); render();
    }
  } catch { alert("Datei konnte nicht gelesen werden."); }
  e.target.value = "";
};
$("clearBtn").onclick = () => {
  if (items.length && confirm("Wirklich ALLE Bewertungen löschen?")) { items = []; save(); render(); }
};

fillSelects(); load(); render();
</script>
</body>
</html>
